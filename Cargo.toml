[workspace]

[package]
name = "mail"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
appcore = { package = "mochios-appcore", git = "https://github.com/mochiOS/devkit" }

mochios-tls-client = { git = "https://github.com/mochiOS/syscalls" }
getrandom = { version = "0.2.17", features = ["custom"] }
base64 = "0.22"
mailparse = "0.16.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["serde"] }

[[bin]]
name = "mail"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mochios"))'] }


[target.'cfg(target_os = "mochios")'.dependencies]
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", default-features = false, features = ["std"] }
mochios-net-device-protocol = { git = "https://github.com/mochiOS/syscalls" }

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23.40", default-features = false, features = ["custom-provider", "std"] }
